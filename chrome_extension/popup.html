<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>그룹스 자동 추가</title>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; padding: 15px; width: 300px; }
    textarea { width: 100%; height: 150px; font-size: 12px; margin-bottom: 10px; }
    button { width: 100%; padding: 10px; background-color: #4285f4; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #357ae8; }
    #status { margin-top: 10px; font-size: 12px; color: #555; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h3>에이블런 자동 회원 추가</h3>
  <p style="font-size: 11px; color: #666;">
    아래에 엑셀 데이터를 복사/붙여넣기 하세요.<br>
    형식: <b>이메일 [Tab] 그룹ID(예:gpt10)</b>
  </p>
  <textarea id="dataInput" placeholder="test@email.com   gpt10\ntest2@email.com  gpt20"></textarea>
  <button id="startBtn">순차적 자동 추가 시작</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
